name: Update Data Snapshots

on:
  schedule:
    # 每 4 天一次，UTC 16:10（北京时间次日 00:10）。
    # 采样频率降低后，趋势图改为按「最近 N 条快照」取点，因此数据日期会有滞后。
    - cron: "10 16 */4 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-snapshots
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update snapshots
        run: |
          if [ -z "$STEAM_API_KEY" ]; then
            echo "::error::Missing STEAM_API_KEY repository secret."
            exit 1
          fi

          node scripts/update-steam-history.mjs
          node scripts/update-bangumi-subscription.mjs
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          BANGUMI_USER_ID: ${{ secrets.BANGUMI_USER_ID || vars.BANGUMI_USER_ID }}

      - name: Commit snapshots
        run: |
          if git diff --quiet -- src/data/steam-history.json src/data/bangumi-manga-progress.json; then
            echo "Snapshots are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/steam-history.json src/data/bangumi-manga-progress.json
          git commit -m "chore: update data snapshots"
          git push
